name: Linux-Release
permissions:
  contents: write
  pull-requests: read

on:
  release:
    types:
      - created
      - edited
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # Source tarballs only
          - FROM: 'debian:bookworm'
            ARTIFACT_EXT: 'tar.[xb]z*'
          # Debian package (.deb)
          - FROM: 'debian:bookworm'
            ARTIFACT_EXT: 'deb'
          # RPM packages (.rpm) across enterprise/community distributions
          - FROM: 'opensuse/leap:16.0'
            ARTIFACT_EXT: 'rpm'
          - FROM: 'fedora:45'
            ARTIFACT_EXT: 'rpm'
          - FROM: 'fedora:44'
            ARTIFACT_EXT: 'rpm'
          - FROM: 'fedora:43'
            ARTIFACT_EXT: 'rpm'
          - FROM: 'rockylinux_rockylinux:10.2'
            ARTIFACT_EXT: 'rpm'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - name: Extract tag name and short SHA
        shell: bash
        run: |
          echo "TAG_NAME=$(echo ${GITHUB_REF#refs/tags/} | sed 's/\//_/g')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Test tag name and short SHA
        run: |
          echo "${TAG_NAME}"
          echo "${SHORT_SHA}"

      - name: Run CI
        env:
          FROM: ${{ matrix.FROM }}
          FLAGS: ''
          IS_RELEASE: 1
        run: script/cibuild $FLAGS

      - name: Upload the artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: "packages/*.${{ matrix.ARTIFACT_EXT }}"
