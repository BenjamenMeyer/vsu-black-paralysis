name: Windows-Release
permissions:
  contents: write
  pull-requests: read

on:
  release:
    types:
      - created
      - edited
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            is-release: 1
            install-nsis: 0
          - os: windows-2025
            is-release: 1
            install-nsis: 1

    env:
      TAG_NAME: '${{ github.ref_name }}'

    steps:
      - name: Export SHORT_SHA
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          echo "SHORT_SHA=$sha" >> $env:GITHUB_ENV

      - name: Test tag name and short SHA
        shell: pwsh
        run: |
          echo "TAG: $env:TAG_NAME"
          echo "SHA: $env:SHORT_SHA"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.5

      - name: Install NSIS
        if: ${{ matrix.install-nsis }}
        uses: repolevedavaj/install-nsis@v1.3.0
        with:
          nsis-version: '3.12'

      - name: Build
        shell: pwsh
        run: script/build.ps1

      - name: Package
        shell: pwsh
        run: script/package.ps1

      - name: Dump NSIS log on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter "NSISOutput.log" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.FullName) ==="
            Get-Content $_.FullName
          }

      - name: Upload the artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: "packages/*.*"
